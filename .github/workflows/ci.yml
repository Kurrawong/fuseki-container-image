name: CI

on:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - uses: go-task/setup-task@v1

      - name: Verify image runtime behavior
        run: task fuseki:verify:ci
